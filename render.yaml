# Render Blueprint: New → Blueprint → pick this repo, and Render creates the site with these settings.
services:
  - type: web
    runtime: static
    name: box-box
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist # the built app; the repo root is source code and must not be published
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_VERSION
        value: "22"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
